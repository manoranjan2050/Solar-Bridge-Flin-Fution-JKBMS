<svg viewBox="0 0 1100 240" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1424"/><stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <style>
      @keyframes flow { to { stroke-dashoffset:-40; } }
      @keyframes bob  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
      .wire { stroke-dasharray:7 13; animation:flow 1s linear infinite; }
      .node { animation:bob 4s ease-in-out infinite; }
      .n2 { animation-delay:.5s } .n3 { animation-delay:1s } .n4 { animation-delay:1.5s } .n5 { animation-delay:2s }
    </style>
  </defs>
  <rect width="1100" height="240" rx="16" fill="url(#bg2)"/>

  <!-- wires -->
  <line x1="190" y1="120" x2="320" y2="120" stroke="#334155" stroke-width="3"/>
  <line class="wire" x1="190" y1="120" x2="320" y2="120" stroke="#f59e0b" stroke-width="3"/>
  <line x1="470" y1="120" x2="600" y2="120" stroke="#334155" stroke-width="3"/>
  <line class="wire" x1="470" y1="120" x2="600" y2="120" stroke="#10b981" stroke-width="3"/>
  <line x1="750" y1="120" x2="880" y2="120" stroke="#334155" stroke-width="3"/>
  <line class="wire" x1="750" y1="120" x2="880" y2="120" stroke="#3b82f6" stroke-width="3"/>

  <!-- node 1: hardware -->
  <g class="node">
    <rect x="40" y="70" width="150" height="100" rx="14" fill="#1a2234" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="115" y="108" text-anchor="middle" font-size="26" fill="#f59e0b">⌁</text>
    <text x="115" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0">Inverter + BMS</text>
    <text x="115" y="152" text-anchor="middle" font-size="11.5" fill="#64748b">USB · RS485</text>
  </g>

  <!-- node 2: raspberry pi -->
  <g class="node n2">
    <rect x="320" y="60" width="150" height="120" rx="14" fill="#1a2234" stroke="#10b981" stroke-width="1.5"/>
    <text x="395" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#10b981">Raspberry Pi</text>
    <text x="395" y="122" text-anchor="middle" font-size="11.5" fill="#94a3b8">solar_bridge.py</text>
    <text x="395" y="140" text-anchor="middle" font-size="11.5" fill="#94a3b8">Flask dashboard</text>
    <text x="395" y="158" text-anchor="middle" font-size="11.5" fill="#94a3b8">SQLite history</text>
  </g>

  <!-- node 3: dashboard -->
  <g class="node n3">
    <rect x="600" y="70" width="150" height="100" rx="14" fill="#1a2234" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="675" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0">Web Dashboard</text>
    <text x="675" y="130" text-anchor="middle" font-size="11.5" fill="#64748b">gauges · charts</text>
    <text x="675" y="148" text-anchor="middle" font-size="11.5" fill="#64748b">PWA · controls</text>
  </g>

  <!-- node 4: outputs -->
  <g class="node n4">
    <rect x="880" y="40" width="180" height="70" rx="12" fill="#1a2234" stroke="#a855f7" stroke-width="1.3"/>
    <text x="970" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#c4b5fd">Home Assistant</text>
    <text x="970" y="92" text-anchor="middle" font-size="11" fill="#64748b">MQTT auto-discovery</text>
  </g>
  <g class="node n5">
    <rect x="880" y="130" width="180" height="70" rx="12" fill="#1a2234" stroke="#22d3ee" stroke-width="1.3"/>
    <text x="970" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#67e8f9">Telegram Bot</text>
    <text x="970" y="182" text-anchor="middle" font-size="11" fill="#64748b">alerts · remote control</text>
  </g>
  <line x1="750" y1="110" x2="880" y2="75"  stroke="#334155" stroke-width="2"/>
  <line x1="750" y1="130" x2="880" y2="165" stroke="#334155" stroke-width="2"/>
</svg>
