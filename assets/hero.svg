<svg viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0a0f1e"/>
      <stop offset="55%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#fde68a"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#fde68a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes pulse { 0%,100%{opacity:.35;transform:scale(1)} 50%{opacity:.7;transform:scale(1.12)} }
      @keyframes blink { 0%,100%{opacity:.25} 50%{opacity:.9} }
      @keyframes dash  { to { stroke-dashoffset:-44; } }
      @keyframes rise  { 0%{transform:translateY(8px);opacity:0} 100%{transform:translateY(0);opacity:1} }
      .halo  { transform-origin:170px 170px; animation:pulse 3.2s ease-in-out infinite; }
      .halo2 { transform-origin:170px 170px; animation:pulse 3.2s ease-in-out infinite .6s; }
      .star  { animation:blink 2.6s ease-in-out infinite; }
      .flow  { stroke-dasharray:6 16; animation:dash 1.1s linear infinite; }
      .ttl   { animation:rise .9s ease-out both; }
      .sub   { animation:rise .9s ease-out .25s both; }
    </style>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#sky)"/>

  <!-- subtle stars -->
  <g fill="#cbd5e1">
    <circle class="star" cx="980" cy="50"  r="1.6"/>
    <circle class="star" cx="1080" cy="90" r="1.2" style="animation-delay:.5s"/>
    <circle class="star" cx="900" cy="280" r="1.3" style="animation-delay:1s"/>
    <circle class="star" cx="1130" cy="240" r="1.5" style="animation-delay:1.5s"/>
    <circle class="star" cx="640" cy="40"  r="1.2" style="animation-delay:.8s"/>
  </g>

  <!-- Sun -->
  <g>
    <circle class="halo"  cx="170" cy="170" r="95" fill="#f59e0b" opacity=".18"/>
    <circle class="halo2" cx="170" cy="170" r="70" fill="#f59e0b" opacity=".28"/>
    <g>
      <g stroke="#f59e0b" stroke-width="5" stroke-linecap="round">
        <line x1="170" y1="60"  x2="170" y2="32"/>
        <line x1="170" y1="280" x2="170" y2="308"/>
        <line x1="60"  y1="170" x2="32"  y2="170"/>
        <line x1="280" y1="170" x2="308" y2="170"/>
        <line x1="92"  y1="92"  x2="72"  y2="72"/>
        <line x1="248" y1="248" x2="268" y2="268"/>
        <line x1="248" y1="92"  x2="268" y2="72"/>
        <line x1="92"  y1="248" x2="72"  y2="268"/>
        <animateTransform attributeName="transform" type="rotate"
          from="0 170 170" to="360 170 170" dur="40s" repeatCount="indefinite"/>
      </g>
      <circle cx="170" cy="170" r="46" fill="url(#sunGrad)" filter="url(#glow)"/>
    </g>
  </g>

  <!-- Title -->
  <text class="ttl" x="360" y="158" font-size="76" font-weight="800" fill="url(#title)">Solar Bridge</text>
  <text class="sub" x="362" y="200" font-size="23" font-weight="500" fill="#94a3b8">
    Self-hosted solar monitoring &amp; control for Raspberry Pi
  </text>
  <text class="sub" x="362" y="232" font-size="16.5" fill="#64748b" style="animation-delay:.4s">
    Voltronic / Axpert inverter  ·  JK BMS  ·  Home Assistant  ·  Telegram
  </text>

  <!-- animated energy flow line -->
  <line x1="362" y1="262" x2="1140" y2="262" stroke="url(#accent)" stroke-width="2"/>
  <line class="flow" x1="362" y1="262" x2="1140" y2="262" stroke="#f59e0b" stroke-width="2.5"/>

  <!-- mini flow legend -->
  <g transform="translate(362,288)" font-size="14.5" fill="#94a3b8">
    <circle cx="6"   cy="-4" r="5" fill="#f59e0b"/><text x="18"  y="0">Solar</text>
    <circle cx="96"  cy="-4" r="5" fill="#10b981"/><text x="108" y="0">Battery</text>
    <circle cx="200" cy="-4" r="5" fill="#f43f5e"/><text x="212" y="0">Load</text>
    <circle cx="290" cy="-4" r="5" fill="#3b82f6"/><text x="302" y="0">Grid</text>
    <circle class="star" cx="384" cy="-4" r="5" fill="#10b981"/>
    <text x="396" y="0" fill="#10b981">live every 10s</text>
  </g>
</svg>
