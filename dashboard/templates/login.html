<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Solar Bridge — Sign In</title>
<!-- PWA -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0a0f1e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Solar Bridge">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/static/icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --bg0:#0a0f1e;--bg1:#111827;--bg2:#1a2234;--bg3:#232f45;
  --border:#2a3a55;--text1:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --solar:#f59e0b;--battery:#10b981;--load:#f43f5e;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;
  background:var(--bg0);color:var(--text1)}

/* animated background */
body{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100dvh;padding:16px;padding-top:env(safe-area-inset-top,16px);
  padding-bottom:env(safe-area-inset-bottom,16px)}
body::before{content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(245,158,11,.12) 0%,transparent 65%);
  pointer-events:none}

/* card */
.card{width:100%;max-width:380px;background:var(--bg1);
  border:1px solid var(--border);border-radius:20px;
  padding:36px 28px;box-shadow:0 20px 60px rgba(0,0,0,.5)}

/* logo + title */
.logo{text-align:center;margin-bottom:24px}
.sun-icon{width:72px;height:72px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#fde68a,#f59e0b 70%);
  box-shadow:0 0 28px 6px rgba(245,158,11,.45);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:2rem;color:#451a03;margin-bottom:14px;
  animation:sunGlow 3s ease-in-out infinite}
@keyframes sunGlow{0%,100%{box-shadow:0 0 22px 4px rgba(245,158,11,.4)}
  50%{box-shadow:0 0 40px 12px rgba(245,158,11,.65)}}
.app-name{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(135deg,#fbbf24,#f59e0b);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.app-sub{font-size:.8rem;color:var(--text3);margin-top:4px}

/* form */
.field{margin-bottom:16px}
label{display:block;font-size:.78rem;color:var(--text2);margin-bottom:6px;font-weight:500}
.input-wrap{position:relative}
.input-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:var(--text3);font-size:.9rem;pointer-events:none}
input{width:100%;padding:13px 14px 13px 40px;background:var(--bg3);
  border:1.5px solid var(--border);border-radius:12px;
  color:var(--text1);font-size:1rem;outline:none;
  -webkit-appearance:none;transition:.2s}
input:focus{border-color:var(--solar);box-shadow:0 0 0 3px rgba(245,158,11,.15)}
input::placeholder{color:var(--text3)}

/* show/hide password */
.eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);
  color:var(--text3);cursor:pointer;padding:4px;font-size:.9rem;pointer-events:all}
.eye:hover{color:var(--text2)}

/* submit button */
.btn{width:100%;padding:14px;border:none;border-radius:12px;
  background:linear-gradient(135deg,#f59e0b,#d97706);
  color:#1a0800;font-size:1rem;font-weight:700;cursor:pointer;
  transition:.2s;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:10px}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn:active{filter:brightness(.95);transform:none}
.btn.loading{opacity:.7;pointer-events:none}

/* error */
.err{background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.35);
  border-radius:10px;padding:11px 14px;font-size:.85rem;color:#fb7185;
  margin-bottom:16px;display:flex;align-items:center;gap:9px}

/* divider + info */
.divider{text-align:center;margin:20px 0 0;font-size:.75rem;color:var(--text3)}
.hint{margin-top:8px;background:var(--bg2);border:1px solid var(--border);
  border-radius:10px;padding:10px 14px;font-size:.8rem;color:var(--text2);line-height:1.6}
.hint strong{color:var(--text1)}

/* author */
.author{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));
  left:0;right:0;text-align:center;
  font-size:.73rem;color:var(--text3)}
.author a{color:var(--text3);text-decoration:none;display:inline-flex;
  align-items:center;gap:6px}
.author a:hover{color:var(--solar)}
.author img{width:18px;height:18px;border-radius:50%;vertical-align:middle}

@media(max-height:600px){.card{padding:22px 20px}.logo{margin-bottom:14px}.sun-icon{width:52px;height:52px;font-size:1.5rem}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="sun-icon">☀️</div>
    <div class="app-name">Solar Bridge</div>
    <div class="app-sub">Flin Fution + JK BMS Monitor</div>
  </div>

  {% if error %}
  <div class="err"><i class="fa fa-circle-exclamation"></i>{{ error }}</div>
  {% endif %}

  <form method="POST" action="/login" id="loginForm">
    <div class="field">
      <label for="username"><i class="fa fa-user"></i> Username</label>
      <div class="input-wrap">
        <i class="fa fa-user"></i>
        <input type="text" id="username" name="username" placeholder="Enter username"
               autocomplete="username" autocorrect="off" autocapitalize="off"
               spellcheck="false" autofocus>
      </div>
    </div>

    <div class="field">
      <label for="password"><i class="fa fa-lock"></i> Password</label>
      <div class="input-wrap">
        <i class="fa fa-lock"></i>
        <input type="password" id="password" name="password" placeholder="Enter password"
               autocomplete="current-password">
        <span class="eye" onclick="togglePwd()" title="Show/hide password">
          <i class="fa fa-eye" id="eyeIcon"></i>
        </span>
      </div>
    </div>

    <button class="btn" type="submit" id="submitBtn">
      <i class="fa fa-right-to-bracket"></i> Sign In
    </button>
  </form>

  <div class="divider">Default credentials</div>
  <div class="hint">
    Username: <strong id="showUser">tap to show</strong><br>
    Password: <strong id="showPass">tap to show</strong><br>
    <small style="color:var(--text3)">Tap here to auto-fill username. Change on System page.</small>
  </div>
</div>

<div class="author">
  <a href="https://github.com/manoranjan2050" target="_blank" rel="noopener">
    <img src="https://github.com/manoranjan2050.png?size=40" alt=""
         onerror="this.style.display='none'">
    Built by Manoranjan · manoranjan.dev
  </a>
</div>

<script>
function togglePwd() {
  const inp = document.getElementById('password');
  const ico = document.getElementById('eyeIcon');
  inp.type = inp.type === 'password' ? 'text' : 'password';
  ico.className = inp.type === 'password' ? 'fa fa-eye' : 'fa fa-eye-slash';
}
// hint: fills the inputs from the config (username only, password blank for security)
document.querySelector('.hint').addEventListener('click', function(){
  fetch('/api/default_user').then(r=>r.json()).then(d=>{
    if (d.username) document.getElementById('username').value = d.username;
    document.getElementById('showUser').textContent = d.username||'admin';
    document.getElementById('showPass').textContent = '(set in config.ini)';
  }).catch(()=>{});
});
document.getElementById('loginForm').addEventListener('submit', function(){
  const btn = document.getElementById('submitBtn');
  btn.classList.add('loading');
  btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Signing in…';
});
// register service worker for PWA even on login page
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
</script>
</body>
</html>
